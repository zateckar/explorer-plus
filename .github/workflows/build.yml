name: Build and release

# Every push / pull request: release build, smoke test, zips as a workflow artifact.
# Every build of main (a push, or a manual run) that passes the smoke test is also
# published as a GitHub release: the zip, the symbols zip (for crash dumps) and their
# SHA-256. The version is the commit's date and the run number (2026.10.10.57, tag
# v2026.10.10.57); the notes are the commits since the previous release.
#
# Optional code signing of release builds: add the repository secrets
# SIGNING_CERT_PFX_BASE64 (the .pfx, base64-encoded) and SIGNING_CERT_PASSWORD.
#
# Actions are pinned by commit (the release in the comment); Dependabot updates both.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# pull requests: a newer push cancels the running build. main: a running build is never
# cancelled half-way; of the pushes made meanwhile only the newest waits (GitHub drops the
# older pending runs), and its release notes reach back to the last release, so nothing
# goes missing from them
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_CERT_PFX_BASE64 != '' }}
      RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    outputs:
      label: ${{ steps.ver.outputs.label }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: MinGW-w64 toolchain (MSYS2 UCRT64)
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      # values from the event reach scripts through env:, never pasted into the script text
      # version: the date of the commit built (UTC, no leading zeros: each part is a number
      # in the exe's version resource), so a re-run builds the same version, and the run
      # number as the fourth part
      - name: Version
        id: ver
        shell: pwsh
        env:
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $d = [DateTimeOffset]::Parse((git show -s --format=%cI $env:SHA)).UtcDateTime
          $version = '{0}.{1}.{2}' -f $d.Year, $d.Month, $d.Day
          if ($env:RELEASE -eq 'true') {
            $label = "$version.$env:RUN_NUMBER"
          } else {
            $label = "$version-ci.$env:RUN_NUMBER." + $env:SHA.Substring(0, 7)
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT
          "tag=v$label" >> $env:GITHUB_OUTPUT
          Write-Host "version $version, label $label"

      # only release builds (main) are signed: pull-request builds never see the key
      - name: Signing certificate
        if: env.HAS_SIGNING == 'true' && env.RELEASE == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "SIGN_PFX=$pfx" >> $env:GITHUB_ENV

      - name: Build and package
        id: pkg
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ env.RELEASE == 'true' && secrets.SIGNING_CERT_PASSWORD || '' }}
          MSYS2_DIR: ${{ steps.msys2.outputs.msys2-location }}
          VERSION: ${{ steps.ver.outputs.version }}
          LABEL: ${{ steps.ver.outputs.label }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $env:PATH = "$env:MSYS2_DIR\ucrt64\bin;" + $env:PATH
          g++ --version | Select-Object -First 1      # (the toolchain in the log)
          cmake --version | Select-Object -First 1
          ./tools/package.ps1 -Version $env:VERSION -Label $env:LABEL -Build $env:RUN_NUMBER

      - name: Unit tests
        shell: pwsh
        env:
          MSYS2_DIR: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = "$env:MSYS2_DIR\ucrt64\bin;" + $env:PATH
          ctest --test-dir build-release --output-on-failure

      - name: Remove signing certificate
        if: always() && env.SIGN_PFX != ''
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue $env:SIGN_PFX

      - name: Smoke test (GUI automation)
        id: smoke
        # gates releases (a failure on main fails the build: no release); on pull requests
        # a signal only
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        timeout-minutes: 10
        shell: pwsh
        run: python -I tools/smoke_test.py build-release/explorer-plus.exe build-smoke

      - name: Smoke test screenshots
        if: always() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-shots-${{ steps.ver.outputs.label }}
          path: build-smoke/shots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: explorer-plus-${{ steps.ver.outputs.label }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # the history and tags since the previous release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: explorer-plus-${{ needs.build.outputs.label }}
          path: dist

      # notes: each commit since the previous release (subject, description, link);
      # written to a file and handed over as one, never pasted into a command line
      - name: Release notes
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if prev=$(git describe --tags --abbrev=0 --match 'v*' --exclude "$TAG" HEAD 2>/dev/null); then
            range="$prev..HEAD"
          else
            prev=""
            range="HEAD"
          fi
          {
            git log --no-merges --format="### %s%n%n%b%n[%h]($url/commit/%H)%n" "$range"
            if [ -n "$prev" ]; then echo "**Full changes**: $url/compare/$prev...$TAG"; fi
          } > notes.md
          [ -s notes.md ] || echo "No changes since $prev." > notes.md
          head -c 120000 notes.md > notes.trimmed && mv notes.trimmed notes.md   # (GitHub's limit: 125,000)
          cat notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          LABEL: ${{ needs.build.outputs.label }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # a re-run of the same build: replace the files
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            # (the tag is made on the commit that was built, not on main's newest)
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Explorer Plus $LABEL" --notes-file notes.md
          fi
